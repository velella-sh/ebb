# Documentation site for ebb, read by Mizzen.
title: Ebb
description: The open almanac of software end-of-life.
lang: en
url: https://velella.sh
base: /ebb
outputs:
  sitemap: true
  page-json: true
social:
  template: lifecycle
  fonts: [_templates/social/manrope-regular.ttf]
network:
  source: https://velella.sh/network.json
  project: ebb
repository:
  url: https://github.com/velella-sh/ebb
  branch: main
  dir: docs
feeds:
  data-releases:
    collection: data-releases
    title: Ebb lifecycle data releases
    date: createdAt
    formats: [rss, atom]
collections:
  data-releases:
    source: _data/site-records/data-releases.json
    template: _templates/data-release.md
    permalink: /data-releases/{id}/
    id: id
    schema: _data/data-release.schema.json
  products:
    source: _data/site-records/products.json
    template: _templates/product.md
    permalink: /products/{slug}/
    id: id
    aliases: aliases
    schema: _data/site-page.schema.json
    evidence: claims
    markdown: [timeline]
    seo:
      jsonLd:
        "@type": Dataset
        "@id": "https://velella.sh/ebb/products/{slug}/#lifecycle-data"
        name: "{title}"
        description: "{summary}"
        identifier: "{purl}"
        version: "{dataVersion}"
    references:
      releaseLines: release-lines
  release-lines:
    source: _data/site-records/release-lines.json
    template: _templates/release-line.md
    permalink: /release-lines/{slug}/
    id: id
    aliases: aliases
    schema: _data/site-page.schema.json
    evidence: claims
    references:
      product: products
  rules:
    source: _data/site-records/rules.json
    template: _templates/rule.md
    permalink: /rules/{slug}/
    id: id
    aliases: aliases
    schema: _data/site-page.schema.json
    evidence: claims
    seo:
      lastmod: reviewedAt
      jsonLd:
        "@type": Dataset
        "@id": "https://velella.sh/ebb/rules/{slug}/#rule-data"
        name: "{title}"
        description: "{summary}"
        identifier: "{id}"
        version: "{dataVersion}"
    references:
      product: products
  deadline-months:
    source: _data/site-records/deadline-months.json
    template: _templates/deadline-month.md
    permalink: /deadlines/{id}/
    id: id
    schema: _data/deadline-month.schema.json
    markdown: [agenda]
    evidence: claims
  release-comparisons:
    source: _data/site-records/comparisons.json
    template: _templates/release-comparison.md
    permalink: /release-comparisons/{productSlug}/{slug}/
    id: id
    schema: _data/release-comparison.schema.json
    markdown: [comparison]
    references:
      product: products
theme:
  overrides:
    components:
      compare: _components/compare.ts
  name: "@velella/lateen"
  options:
    preset: ebb
    status:
      values:
        ended: { label: Ended, tone: negative }
        ending: { label: Ending, tone: caution }
        no-known-end: { label: No known end, tone: neutral }
        active: { label: Active, tone: positive }
        scheduled: { label: Scheduled end of life, tone: caution }
        deprecated: { label: Deprecated, tone: caution }
        end-of-support: { label: End of support, tone: negative }
        end-of-life: { label: End of life, tone: negative }
        removed: { label: Removed, tone: negative }
        scheduled-end-of-life: { label: Scheduled end of life, tone: caution }
        end-of-active-support: { label: End of active support, tone: caution }
        end-of-extended-support: { label: End of extended support, tone: negative }
    network:
      switcher: false
      footer: false
      search: false
    logo:
      light: /brand/mark-light.svg
      dark: /brand/mark-dark.svg
    favicon:
      svg: /brand/favicon.svg
      ico: /brand/favicon.ico
      apple: /brand/apple-touch-icon.png
    editPage:
      headingLinks: true
    footer:
      copyright: "© Velella"
      license: "MIT license"
      links:
        - title: GitHub
          url: https://github.com/velella-sh/ebb
        - title: Mizzen
          url: https://velella.sh/mizzen/
        - title: Lateen
          url: https://velella.sh/lateen/
