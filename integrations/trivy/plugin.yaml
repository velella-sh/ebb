name: "ebb"
repository: "https://github.com/velella-sh/ebb"
version: "0.2.1"
usage: "trivy ebb [image|fs] <target>"
description: "Scan for package lifecycle milestones, end-of-life runtimes, and deprecations"
platforms:
  - selector:
      os: linux
      arch: amd64
    bin: ebb.sh
  - selector:
      os: linux
      arch: arm64
    bin: ebb.sh
  - selector:
      os: darwin
      arch: amd64
    bin: ebb.sh
  - selector:
      os: darwin
      arch: arm64
    bin: ebb.sh
