name: Pre-commit E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit-e2e:
    name: Pre-commit Hook E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies & pinned pre-commit
        run: |
          npm ci
          npm run build
          pip install pre-commit==3.8.0

      - name: Test pre-commit hook in clean repository
        run: |
          set -e
          # Pre-commit clones the hook repository before packing it. Seed that clone with
          # this build's compiled files so the test also works before the npm release.
          HOOK_REPO=$(mktemp -d)
          git clone --quiet "$GITHUB_WORKSPACE" "$HOOK_REPO"
          cp -R "$GITHUB_WORKSPACE/dist" "$HOOK_REPO/dist"
          git -C "$HOOK_REPO" add -f dist
          git -C "$HOOK_REPO" -c user.name="Ebb E2E Test" -c user.email="test@velella.sh" \
            commit --quiet -m "Package the workflow build"
          HOOK_COMMIT=$(git -C "$HOOK_REPO" rev-parse HEAD)

          CLEAN_REPO=$(mktemp -d)
          echo "Setting up clean consuming repo at $CLEAN_REPO"
          cd "$CLEAN_REPO"

          git init
          git config user.name "Ebb E2E Test"
          git config user.email "test@velella.sh"

          cat <<EOF > .pre-commit-config.yaml
          repos:
            - repo: $HOOK_REPO
              rev: $HOOK_COMMIT
              hooks:
                - id: ebb-sbom
                  additional_dependencies: []
                - id: ebb-purls
                  additional_dependencies: []
          EOF

          # Verify failing commit
          cp "$GITHUB_WORKSPACE/examples/pre-commit/sbom-fail.json" ./sbom.json
          git add .pre-commit-config.yaml sbom.json
          echo "Running pre-commit on failing SBOM (expecting exit code 1)..."
          if pre-commit run --all-files; then
            echo "Expected pre-commit to fail on sbom-fail.json, but it passed!"
            exit 1
          else
            echo "Pre-commit correctly failed on end-of-life finding."
          fi

          # Verify passing commit
          cp "$GITHUB_WORKSPACE/examples/pre-commit/sbom-pass.json" ./sbom.json
          cp "$GITHUB_WORKSPACE/examples/pre-commit/.ebb-purls" ./.ebb-purls
          git add sbom.json .ebb-purls
          echo "Running pre-commit on passing SBOM..."
          pre-commit run --all-files
          git commit -m "chore: add dependencies verified by ebb pre-commit"
          echo "Passing commit succeeded."
