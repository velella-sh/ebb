name: Benchmark

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          node-version: "22"
          cache: npm
      - name: Run benchmarks
        run: npm run bench
      - name: Fetch previous main baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline
          LATEST_RUN=$(gh run list --workflow Benchmark --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$LATEST_RUN" ] && [ "$LATEST_RUN" != "null" ]; then
            gh run download "$LATEST_RUN" --name bench-results --dir baseline || echo "No previous baseline artifact found."
          fi
      - name: Check for performance regressions
        if: github.event_name == 'pull_request'
        run: |
          node dist/tools/bench-compare.js bench-results.json baseline/bench-results.json --threshold 0.20
      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-results
          path: bench-results.json
          if-no-files-found: error
