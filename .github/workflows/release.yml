name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    name: Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify checks
        run: npm run check

      - name: Verify API stability
        run: npm run api:check

      - name: Verify rule integrity
        run: npm run lint:rules

      - name: Check package size
        run: npm run size

      - name: Build package
        run: npm run build

      - name: Build LLMs documentation
        run: npm run build:llms

      - name: Publish to npm with provenance
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$(npm view @velella/ebb@$VERSION version 2>/dev/null)" = "$VERSION" ]; then
            echo "@velella/ebb@$VERSION is already published to npm, skipping."
          else
            if [[ "$VERSION" =~ - ]]; then
              npm publish --provenance --access public --tag next
            else
              npm publish --provenance --access public --tag latest
              # Clean up stale next dist-tag or point to current stable
              npm dist-tag rm @velella/ebb next 2>/dev/null || npm dist-tag add @velella/ebb@$VERSION next 2>/dev/null || true
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Publish to JSR with provenance
        run: |
          git checkout -- evals/agents/results.json || true
          deno publish --allow-dirty

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Update major tag (v0)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa v0 -m "Release v0"
          git push origin v0 --force
