name: CI

# Builds Ebb, checks formatting, runs every test, lints every registry and checks every case, and makes sure the
# package that would be published installs and loads. Offline: no network step beyond installing dependencies.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: check
        run: |
          npm run check
          if ! grep -q 'purl-spec pass rate:' "$GITHUB_STEP_SUMMARY"; then
            echo "::error::purl-spec pass rate missing from the job summary"
            exit 1
          fi
          grep 'purl-spec pass rate:' "$GITHUB_STEP_SUMMARY"
      - run: npm run lint:rules
      - name: Install the packed package and load it
        run: |
          npm pack --silent
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/velella-ebb-*.tgz
          node --input-type=module -e '
            const { bundledRules } = await import("@velella/ebb/bundled-rules");
            const { parsePurl } = await import("@velella/ebb/purl");
            const rules = await bundledRules();
            if (rules.length === 0) throw new Error("no bundled rules");
            parsePurl("pkg:npm/request@2.88.2");
            console.log(`${rules.length} rules load from the packed package`);
          '

  # Measures line coverage and publishes it for the README badge. It runs on main only, and holds the
  # only write permission in this workflow: it can push the `badges` branch and nothing else. The badge
  # is a shields.io endpoint badge reading coverage.json from that branch, so the number follows main.
  coverage:
    name: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          node-version: "22"
          cache: npm
      - name: Measure coverage
        run: |
          npm run test:coverage
          npm run coverage:badge
          echo "line coverage: $(node -p "require('./coverage/coverage.json').message")" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the badge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          rm -rf badges
          git init --quiet badges
          cd badges
          git checkout --quiet -b badges
          cp "$GITHUB_WORKSPACE/coverage/coverage.json" coverage.json
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "chore(badges): coverage for ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
