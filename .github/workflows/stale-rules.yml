name: Stale rules

# Weekly check for lifecycle rules whose last review is outside their freshness window.
# Opens (or updates) a single issue labeled as a good first task. Never edits rules.

on:
  schedule:
    - cron: "42 6 * * 1" # Mondays, 06:42 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: stale-rules
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - run: npm run build --silent
      - name: Open or update the weekly stale-rules issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { writeFileSync } from "node:fs";
          import {
            STALE_ISSUE_LABELS,
            STALE_ISSUE_MARKER,
            formatStaleIssueBody,
            formatStaleText,
            stale,
            staleBadgeEndpoint,
            staleIssueTitle,
          } from "./dist/src/stale.js";

          const result = stale();
          const text = formatStaleText(result);
          process.stdout.write(text);
          if (process.env.GITHUB_STEP_SUMMARY) {
            writeFileSync(process.env.GITHUB_STEP_SUMMARY, `${text}\n`, { flag: "a" });
          }

          writeFileSync("stale-report.json", `${JSON.stringify(result, null, 2)}\n`);
          writeFileSync("stale-rules.json", `${JSON.stringify(staleBadgeEndpoint(result), null, 2)}\n`);
          writeFileSync("stale-issue-title.txt", staleIssueTitle(result.asOf));
          writeFileSync("stale-issue-body.md", formatStaleIssueBody(result));
          writeFileSync(
            "stale-issue-meta.env",
            [
              `STALE_COUNT=${result.counts.stale}`,
              `STALE_SOON_COUNT=${result.counts.staleSoon}`,
              `STALE_MARKER=${STALE_ISSUE_MARKER}`,
              `STALE_LABELS=${STALE_ISSUE_LABELS.join(",")}`,
              "",
            ].join("\n"),
          );
          EOF

          # shellcheck source=/dev/null
          source stale-issue-meta.env

          if [ "$STALE_COUNT" -eq 0 ] && [ "$STALE_SOON_COUNT" -eq 0 ]; then
            echo "No stale rules; leaving issues unchanged."
            exit 0
          fi

          existing="$(
            gh issue list --state open --limit 50 --json number,body,title \
              --jq ".[] | select(.body | contains(\"$STALE_MARKER\")) | .number" \
              | head -n 1
          )"

          if [ -n "$existing" ]; then
            echo "Updating issue #$existing"
            gh issue edit "$existing" \
              --title "$(cat stale-issue-title.txt)" \
              --body-file stale-issue-body.md
            # Ensure the good-first-task label stays on the tracked issue.
            gh issue edit "$existing" --add-label "good first issue" || true
          else
            echo "Opening a new stale-rules issue"
            gh issue create \
              --title "$(cat stale-issue-title.txt)" \
              --body-file stale-issue-body.md \
              --label "$STALE_LABELS"
          fi
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stale-report
          path: |
            stale-report.json
            stale-rules.json
            stale-issue-body.md
          if-no-files-found: warn
