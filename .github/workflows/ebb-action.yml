name: Ebb Action CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-action:
    name: Test GitHub Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Run Ebb Action (Passing Check)
        uses: ./
        with:
          purls: |
            pkg:npm/axios@1.6.0
            pkg:generic/node@24.0.0
          fail-on: deprecated

      - name: Run Ebb Action with Warning Only (Scheduled)
        uses: ./
        with:
          purls: |
            pkg:generic/node@22.0.0
          fail-on: deprecated

      - name: Run Ebb Action with Warning Only (fail-on none)
        uses: ./
        with:
          purls: |
            pkg:npm/request@2.88.2
          fail-on: none
