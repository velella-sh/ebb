name: New product triage

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: new-product-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: contains(github.event.issue.labels.*.name, 'new-product') && (github.event.action != 'labeled' || github.event.label.name == 'new-product')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Inspect the vendor source
        id: evidence
        run: |
          npm run build --silent
          node dist/tools/new-product-triage.js
      - name: Update the triage comment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DATED: ${{ steps.evidence.outputs.dated }}
        shell: bash
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments"
          existing=$(gh api --paginate "$endpoint" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- ebb-new-product-triage -->"))) | .id' | sed -n '1p')
          if [[ -n "$existing" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@new-product-triage.md --silent
          else
            gh api --method POST "$endpoint" -F body=@new-product-triage.md --silent
          fi
          if [[ "$DATED" == true ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "good first rule"
          else
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "good first rule"
          fi
