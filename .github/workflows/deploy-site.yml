name: deploy-site

# Builds docs/ with Mizzen and the Lateen theme, and deploys it to this repository's GitHub Pages site,
# https://velella.sh/ebb/. Pull requests that touch the docs only build and check the site.
# Pages' source must be set to "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["docs/**", "llms.txt", "llms-full.txt", ".github/workflows/deploy-site.yml"]
  pull_request:
    paths: ["docs/**", "llms.txt", "llms-full.txt", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install the site tools
        run: |
          mkdir "$RUNNER_TEMP/site-tools"
          cd "$RUNNER_TEMP/site-tools"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact @velella/mizzen@0.1.0 @velella/lateen@0.1.0
      - name: Check the site
        run: $RUNNER_TEMP/site-tools/node_modules/.bin/mizzen check docs --theme "$RUNNER_TEMP/site-tools/node_modules/@velella/lateen"
      - name: Build the site
        run: $RUNNER_TEMP/site-tools/node_modules/.bin/mizzen build docs --theme "$RUNNER_TEMP/site-tools/node_modules/@velella/lateen" --out "$RUNNER_TEMP/site"
      - name: Copy LLM documentation to site
        run: cp llms.txt llms-full.txt "$RUNNER_TEMP/site/"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
