name: deploy-site

# Builds docs/ with Mizzen and the Lateen theme, and deploys it to this repository's GitHub Pages site,
# https://velella.sh/ebb/. Pull requests that touch the docs only build and check the site.
# Pages' source must be set to "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["docs/**", "registry/**", "tools/coverage/**", "tools/static-api/**", "tools/site-data/**", "schemas/site-data.v1.schema.json", "src/**", "llms.txt", "llms-full.txt", ".github/workflows/deploy-site.yml"]
  pull_request:
    paths: ["docs/**", "registry/**", "tools/coverage/**", "tools/static-api/**", "tools/site-data/**", "schemas/site-data.v1.schema.json", "src/**", "llms.txt", "llms-full.txt", ".github/workflows/deploy-site.yml"]
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_DATA_VERSION: "2026.11.11"
      SITE_DATA_SHA256: "09f3f558e6708b6f7ec8fd4df0494601d4c1c99eb50526f7db20591a3852f3a4"
    outputs:
      eol-compat-sha256: ${{ steps.eol-compat.outputs.sha256 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install the site tools
        run: |
          echo "EBB_SITE_TOOLS=$RUNNER_TEMP/site-tools/node_modules" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/site-tools"
          cd "$RUNNER_TEMP/site-tools"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact @velella/mizzen@0.2.7 @velella/lateen@0.2.5 @velella/ebb@0.2.0
      - name: Install dependencies
        run: npm ci
      - name: Publish coverage tables into the docs
        run: |
          npm run build --silent
          # Exit 0 = complete, 1 = gaps (table still written), >=2 = checker/write failure.
          set +e
          node dist/tools/coverage/runtimes.js --write-docs
          runtime_code=$?
          node dist/tools/coverage/actions.js --write-docs
          actions_code=$?
          set -e
          if [ "$runtime_code" -ge 2 ] || [ "$actions_code" -ge 2 ]; then
            echo "Coverage checker or docs write failed (runtime $runtime_code, actions $actions_code)"
            exit 2
          fi
          echo "Coverage tables published (runtime $runtime_code, actions $actions_code)"
      - name: Prepare the signed site records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_dir="$RUNNER_TEMP/site-release"
          site_as_of="$(date -u +%F)"
          echo "SITE_AS_OF=$site_as_of" >> "$GITHUB_ENV"
          bundle="ebb-data-${SITE_DATA_VERSION}.json"
          gh release download "data-v${SITE_DATA_VERSION}" --repo velella-sh/ebb --dir "$release_dir" \
            --pattern "$bundle" --pattern "$bundle.sigstore.json" \
            --pattern release-log.jsonl --pattern release-log.jsonl.sigstore.json
          node dist/tools/site-data/index.js \
            --bundle "$release_dir/$bundle" --signature "$release_dir/$bundle.sigstore.json" \
            --sha256 "$SITE_DATA_SHA256" --data-version "$SITE_DATA_VERSION" --as-of "$site_as_of" \
            --historical-verifier "$RUNNER_TEMP/site-tools/node_modules/@velella/ebb" \
            --out "$RUNNER_TEMP/site-records" --mizzen-out docs/_data/site-records
      - name: Check the site
        run: |
          "$RUNNER_TEMP/site-tools/node_modules/.bin/mizzen" doctor docs --theme "$RUNNER_TEMP/site-tools/node_modules/@velella/lateen"
          "$RUNNER_TEMP/site-tools/node_modules/.bin/mizzen" check docs --theme "$RUNNER_TEMP/site-tools/node_modules/@velella/lateen"
      - name: Build the site
        run: |
          "$RUNNER_TEMP/site-tools/node_modules/.bin/mizzen" build docs --theme "$RUNNER_TEMP/site-tools/node_modules/@velella/lateen" --out "$RUNNER_TEMP/site"
      - name: Publish feed aliases
        run: |
          cp "$RUNNER_TEMP/site/feeds/data-releases.rss.xml" "$RUNNER_TEMP/site/feed.xml"
          cp "$RUNNER_TEMP/site/feeds/data-releases.xml" "$RUNNER_TEMP/site/atom.xml"
          cp "$RUNNER_TEMP/site/feeds/data-releases.xml" "$RUNNER_TEMP/site/data-changelog.atom"
      - name: Check signed record and published-library parity
        run: |
          release_dir="$RUNNER_TEMP/site-release"
          bundle="$release_dir/ebb-data-${SITE_DATA_VERSION}.json"
          EBB_SITE_BUNDLE="$bundle" EBB_SITE_SIGNATURE="$bundle.sigstore.json" \
            EBB_SITE_RELEASED_EBB="$RUNNER_TEMP/site-tools/node_modules/@velella/ebb" \
            EBB_SITE_VERSION="$SITE_DATA_VERSION" EBB_SITE_SHA256="$SITE_DATA_SHA256" EBB_SITE_AS_OF="$SITE_AS_OF" \
            EBB_SITE_BUILT_HTML="$RUNNER_TEMP/site" node --test dist/tests/site-data-signed.test.js dist/tests/site-metadata.test.js dist/tests/site-feeds.test.js
      - name: Build static API
        run: |
          npm run build:static-api -- --out "$RUNNER_TEMP/site/api/v1" --eol-compat-out "$RUNNER_TEMP/site/api/eol-compat/v1"
      - name: Record built compatibility response
        id: eol-compat
        run: |
          sha256sum "$RUNNER_TEMP/site/api/eol-compat/v1/products/nodejs.json" | awk '{print "sha256=" $1}' >> "$GITHUB_OUTPUT"
      - name: Copy LLM documentation to site
        run: |
          cp llms.txt llms-full.txt "$RUNNER_TEMP/site/"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Build tools
        run: npm run build --silent
      - name: Smoke test deployed static API
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
          EOL_COMPAT_SHA256: ${{ needs.build.outputs.eol-compat-sha256 }}
        run: node dist/tools/static-api/smoke.js "${PAGE_URL}api/v1" "$EOL_COMPAT_SHA256"
