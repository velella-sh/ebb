name: deploy-site

# Builds docs/ with Mizzen and the Lateen theme, and deploys it to this repository's GitHub Pages site,
# https://velella.sh/ebb/. Pull requests that touch the docs only build and check the site.
# Pages' source must be set to "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["docs/**", "registry/**", "tools/coverage/**", "tools/static-api/**", "src/**", "llms.txt", "llms-full.txt", ".github/workflows/deploy-site.yml"]
  pull_request:
    paths: ["docs/**", "registry/**", "tools/coverage/**", "tools/static-api/**", "src/**", "llms.txt", "llms-full.txt", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install the site tools
        run: |
          mkdir "$RUNNER_TEMP/site-tools"
          cd "$RUNNER_TEMP/site-tools"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact @velella/mizzen@0.2.7 @velella/lateen@0.2.5
      - name: Install dependencies
        run: npm ci
      - name: Publish coverage tables into the docs
        run: |
          npm run build --silent
          # Exit 0 = complete, 1 = gaps (table still written), >=2 = checker/write failure.
          set +e
          node dist/tools/coverage/runtimes.js --write-docs
          runtime_code=$?
          node dist/tools/coverage/actions.js --write-docs
          actions_code=$?
          set -e
          if [ "$runtime_code" -ge 2 ] || [ "$actions_code" -ge 2 ]; then
            echo "Coverage checker or docs write failed (runtime $runtime_code, actions $actions_code)"
            exit 2
          fi
          echo "Coverage tables published (runtime $runtime_code, actions $actions_code)"
      - name: Check the site
        run: |
          $RUNNER_TEMP/site-tools/node_modules/.bin/mizzen doctor docs --theme "$RUNNER_TEMP/site-tools/node_modules/@velella/lateen"
          $RUNNER_TEMP/site-tools/node_modules/.bin/mizzen check docs --theme "$RUNNER_TEMP/site-tools/node_modules/@velella/lateen"
      - name: Build the site
        run: $RUNNER_TEMP/site-tools/node_modules/.bin/mizzen build docs --theme "$RUNNER_TEMP/site-tools/node_modules/@velella/lateen" --out "$RUNNER_TEMP/site"
      - name: Build static API
        run: npm run build:static-api -- --out "$RUNNER_TEMP/site/api/v1"
      - name: Copy LLM documentation to site
        run: |
          cp llms.txt llms-full.txt "$RUNNER_TEMP/site/"
          cp docs/data-changelog.atom "$RUNNER_TEMP/site/data-changelog.atom"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Build tools
        run: npm run build --silent
      - name: Smoke test deployed static API
        run: node dist/tools/static-api/smoke.js "${{ steps.deploy.outputs.page_url }}api/v1"
