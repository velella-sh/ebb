name: Lifecycle importers

# Drafts lifecycle rules from the authoritative sources every week and opens one pull request per
# importer when the drafts differ from the registry. It never edits registry/: the pull request adds the
# draft file and an evidence table, and a maintainer reviews the facts and changes the registry by hand
# (docs/IMPORTERS.md). It needs the network, so it is not part of pull-request CI.
#
# One pull request per importer: Python and PHP each have two sources, so each gets two.
# The repository setting "Allow GitHub Actions to create and approve pull requests" must be on.

on:
  schedule:
    - cron: "43 5 * * 2" # Tuesdays, 05:43 UTC, after the Monday source-freshness check
  workflow_dispatch:
    inputs:
      coverage-only:
        description: Run only the coverage reports
        type: boolean
        default: false

permissions: {}

concurrency:
  group: importers
  cancel-in-progress: false

jobs:
  draft:
    if: ${{ !inputs.coverage-only }}
    name: draft (${{ matrix.importer }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { importer: ci-images-1, ecosystem: ci-images }
          - { importer: container-official-images, ecosystem: container }
          - { importer: cpp-1, ecosystem: cpp }
          - { importer: dart-1, ecosystem: dart }
          - { importer: database-1, ecosystem: database }
          - { importer: database-2, ecosystem: database }
          - { importer: dotnet-1, ecosystem: dotnet }
          - { importer: dotnet-2, ecosystem: dotnet }
          - { importer: endoflife-date, ecosystem: container }
          - { importer: github-actions-runtime, ecosystem: github-actions }
          - { importer: go-1, ecosystem: go }
          - { importer: go-2, ecosystem: go }
          - { importer: java-1, ecosystem: java }
          - { importer: java-2, ecosystem: java }
          - { importer: kubernetes-1, ecosystem: kubernetes }
          - { importer: nodejs-schedule, ecosystem: nodejs }
          - { importer: npm-deprecated, ecosystem: npm }
          - { importer: osv, ecosystem: osv }
          - { importer: php-1, ecosystem: php }
          - { importer: php-2, ecosystem: php }
          - { importer: pypi-status, ecosystem: python }
          - { importer: python-release-cycle, ecosystem: python }
          - { importer: ruby-1, ecosystem: ruby }
          - { importer: rust-1, ecosystem: rust }
          - { importer: serverless-1, ecosystem: serverless }
          - { importer: serverless-2, ecosystem: serverless }
          - { importer: shell-1, ecosystem: shell }
          - { importer: swift-1, ecosystem: swift }
          - { importer: terraform-1, ecosystem: terraform }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - run: npm run build --silent
      - name: Draft rules from the source
        env:
          IMPORTER: ${{ matrix.importer }}
        run: node dist/tools/importers/run.js "$IMPORTER" --out drafts.json
      - name: Compare with the registry
        id: diff
        env:
          ECOSYSTEM: ${{ matrix.ecosystem }}
        run: |
          set +e
          node dist/tools/importers/diff.js drafts.json "registry/$ECOSYSTEM.json"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 10 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi
      - name: Write the pull request description
        if: steps.diff.outputs.changed == 'true'
        env:
          ECOSYSTEM: ${{ matrix.ecosystem }}
        run: node dist/tools/importers/pr-body.js drafts.json "registry/$ECOSYSTEM.json" --out body.md
      - name: Keep every draft for the source comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: all-drafts-${{ matrix.importer }}
          path: drafts.json
          if-no-files-found: error
      - name: Keep the drafts
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: drafts-${{ matrix.importer }}
          path: |
            drafts.json
            body.md
          if-no-files-found: error

  propose:
    name: propose (${{ matrix.importer }})
    needs: draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        importer:
          - ci-images-1
          - container-official-images
          - cpp-1
          - dart-1
          - database-1
          - database-2
          - dotnet-1
          - dotnet-2
          - endoflife-date
          - github-actions-runtime
          - go-1
          - go-2
          - java-1
          - java-2
          - kubernetes-1
          - nodejs-schedule
          - npm-deprecated
          - osv
          - php-1
          - php-2
          - pypi-status
          - python-release-cycle
          - ruby-1
          - rust-1
          - serverless-1
          - serverless-2
          - shell-1
          - swift-1
          - terraform-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # zizmor: ignore[artipacked] -- it pushes the importer branch with the checkout token
      - name: Fetch the drafts, if this importer found a difference
        id: fetch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: drafts-${{ matrix.importer }}
      - name: Open or update the pull request
        if: steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          IMPORTER: ${{ matrix.importer }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="importers/${IMPORTER}"
          mkdir -p importer-drafts
          cp drafts.json "importer-drafts/${IMPORTER}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add "importer-drafts/${IMPORTER}.json"
          if git diff --cached --quiet; then
            echo "The drafts match what is already proposed."
            exit 0
          fi
          git commit -m "chore: draft lifecycle rules from ${IMPORTER}"
          git push --force origin "$branch"
          title="chore: review lifecycle drafts from ${IMPORTER}"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" --title "$title" --body-file body.md
          else
            gh pr create --head "$branch" --base "$DEFAULT_BRANCH" --title "$title" --body-file body.md
          fi

  candidates:
    name: candidates (${{ matrix.importer }})
    needs: draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        importer:
          - ci-images-1
          - container-official-images
          - cpp-1
          - dart-1
          - database-1
          - database-2
          - dotnet-1
          - dotnet-2
          - endoflife-date
          - github-actions-runtime
          - go-1
          - go-2
          - java-1
          - java-2
          - kubernetes-1
          - nodejs-schedule
          - npm-deprecated
          - osv
          - php-1
          - php-2
          - pypi-status
          - python-release-cycle
          - ruby-1
          - rust-1
          - serverless-1
          - serverless-2
          - shell-1
          - swift-1
          - terraform-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fetch the drafts, if this importer found a difference
        id: fetch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: drafts-${{ matrix.importer }}
      - uses: $/.github/actions/setup
        if: steps.fetch.outcome == 'success'
        with:
          cache: npm
      - if: steps.fetch.outcome == 'success'
        run: npm run build --silent
      - name: Open good first issues for unreviewed candidates
        if: steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node dist/tools/importers/candidate-issues.js drafts.json --max-open 10

  disagreements:
    name: source disagreements
    needs: draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fetch every importer's drafts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: all-drafts-*
          path: all-drafts
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - run: npm run build --silent
      - name: Open an issue for each disagreement between sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node dist/tools/importers/disagreements.js all-drafts/*/drafts.json --max-open 10
          code=$?
          set -e
          # Exit 10 means disagreements were found and reported; anything else but 0 is a failure.
          if [ "$code" -ne 0 ] && [ "$code" -ne 10 ]; then exit "$code"; fi

  runtime-coverage:
    name: runtime coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - run: npm run build --silent
      - name: Report runtime coverage gaps (never edits registry/)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { writeFileSync } from "node:fs";
          import {
            checkRuntimeCoverage,
            coverageIssueMarker,
            coverageIssueTitle,
            formatCoverageIssueBody,
            formatCoverageText,
          } from "./dist/tools/coverage/runtimes.js";

          const report = await checkRuntimeCoverage();
          const text = formatCoverageText(report);
          process.stdout.write(text);
          if (process.env.GITHUB_STEP_SUMMARY) {
            writeFileSync(process.env.GITHUB_STEP_SUMMARY, `${text}\n`, { flag: "a" });
          }
          writeFileSync("runtime-coverage.json", `${JSON.stringify(report, null, 2)}\n`);

          const gaps = report.runtimes.filter((runtime) => !runtime.complete);
          for (const runtime of gaps) {
            if (!/^[a-z][a-z0-9-]*$/.test(runtime.runtime)) {
              throw new Error(`Invalid runtime identifier: ${runtime.runtime}`);
            }
            writeFileSync(`runtime-coverage-issue-${runtime.runtime}.md`, formatCoverageIssueBody(runtime));
            writeFileSync(`runtime-coverage-title-${runtime.runtime}.txt`, coverageIssueTitle(runtime.runtime));
            writeFileSync(`runtime-coverage-marker-${runtime.runtime}.txt`, coverageIssueMarker(runtime.runtime));
          }
          EOF

          runtimes="$(jq -r '.runtimes[] | select(.complete == false) | .runtime' runtime-coverage.json)"
          if [ -z "$runtimes" ]; then
            echo "No runtime coverage gaps; leaving issues unchanged."
            exit 0
          fi

          # The REST list includes pull requests and emits one array per page.
          issues="$(gh api --paginate --slurp "repos/$GH_REPO/issues?state=open&per_page=100")"
          while IFS= read -r runtime; do
            marker="$(cat "runtime-coverage-marker-${runtime}.txt")"
            existing="$(
              jq -r --arg marker "$marker" '
                first(.[][] | select(has("pull_request") | not)
                  | select((.body // "" | split("\n") | map(rtrimstr("\r")) | index($marker)) != null)
                  | .number) // empty
              ' <<< "$issues"
            )"
            if [ -n "$existing" ]; then
              echo "Coverage gap issue #$existing already open for $runtime"
            else
              echo "Opening coverage gap issue for $runtime"
              gh issue create \
                --title "$(cat "runtime-coverage-title-${runtime}.txt")" \
                --body-file "runtime-coverage-issue-${runtime}.md" \
                --label "type:task"
            fi
          done <<< "$runtimes"
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime-coverage
          path: |
            runtime-coverage.json
            runtime-coverage-issue-*.md
          if-no-files-found: warn

  actions-coverage:
    name: actions coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - run: npm run build --silent
      - name: Report Actions coverage gaps (never edits registry/)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { writeFileSync } from "node:fs";
          import { checkActionCoverage, formatCoverageText } from "./dist/tools/coverage/actions.js";

          const report = await checkActionCoverage();
          const text = formatCoverageText(report);
          process.stdout.write(text);
          if (process.env.GITHUB_STEP_SUMMARY) {
            writeFileSync(process.env.GITHUB_STEP_SUMMARY, `${text}\n`, { flag: "a" });
          }
          writeFileSync("actions-coverage.json", `${JSON.stringify(report, null, 2)}\n`);
          EOF
          # Gap issues are opened only by the actions-inventory job, so the two jobs cannot race.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: actions-coverage
          path: |
            actions-coverage.json
            actions-coverage-issue-*.md
          if-no-files-found: warn

  actions-inventory:
    if: ${{ !inputs.coverage-only }}
    name: actions inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
        # zizmor: ignore[artipacked] -- it pushes the inventory branch with the checkout token
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - run: npm run build --silent
      - name: Refresh the inventory snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node dist/tools/coverage/refresh-actions-inventory.js
          npm exec --no -- biome format --write tools/coverage/expected/github-actions-inventory.json
      - name: Report gaps and publish the coverage table
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Gaps open issues; they must not fail the inventory refresh job.
          node --input-type=module <<'EOF'
          import { writeFileSync } from "node:fs";
          import {
            checkActionCoverage,
            coverageIssueMarker,
            coverageIssueTitle,
            formatCoverageIssueBody,
            formatCoverageText,
            writeCoverageDoc,
          } from "./dist/tools/coverage/actions.js";

          const report = await checkActionCoverage();
          const text = formatCoverageText(report);
          process.stdout.write(text);
          if (process.env.GITHUB_STEP_SUMMARY) {
            writeFileSync(process.env.GITHUB_STEP_SUMMARY, `${text}\n`, { flag: "a" });
          }
          await writeCoverageDoc(report);
          writeFileSync("actions-inventory-coverage.json", `${JSON.stringify(report, null, 2)}\n`);
          const gaps = report.actions.filter((action) => !action.complete);
          for (const action of gaps) {
            writeFileSync(`actions-coverage-issue-${action.slug}.md`, formatCoverageIssueBody(action));
            writeFileSync(`actions-coverage-title-${action.slug}.txt`, coverageIssueTitle(action.action));
            writeFileSync(`actions-coverage-marker-${action.slug}.txt`, coverageIssueMarker(action.action));
          }
          EOF
          slugs="$(jq -r '.actions[] | select(.complete == false) | .slug' actions-inventory-coverage.json)"
          if [ -z "$slugs" ]; then
            echo "No Actions coverage gaps; leaving issues unchanged."
            exit 0
          fi
          issues="$(gh api --paginate --slurp "repos/$GH_REPO/issues?state=open&per_page=100")"
          while IFS= read -r slug; do
            marker="$(cat "actions-coverage-marker-${slug}.txt")"
            existing="$(
              jq -r --arg marker "$marker" '
                first(.[][] | select(has("pull_request") | not)
                  | select((.body // "" | split("\n") | map(rtrimstr("\r")) | index($marker)) != null)
                  | .number) // empty
              ' <<< "$issues"
            )"
            if [ -n "$existing" ]; then
              echo "Coverage gap issue #$existing already open for $slug"
            else
              echo "Opening coverage gap issue for $slug"
              gh issue create \
                --title "$(cat "actions-coverage-title-${slug}.txt")" \
                --body-file "actions-coverage-issue-${slug}.md" \
                --label "type:task"
            fi
          done <<< "$slugs"
      - name: Open or update an inventory-only pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node dist/tools/coverage/publish-inventory-pr.js
      - name: Upload the refreshed coverage table
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: actions-inventory-coverage
          path: |
            docs/coverage.md
            actions-inventory-coverage.json
            actions-coverage-issue-*.md
          if-no-files-found: warn

  image-variants-draft:
    if: ${{ !inputs.coverage-only }}
    name: draft official image variants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - run: npm run build --silent
      - name: Compare pinned library file hashes
        id: diff
        run: |
          node dist/tools/importers/run.js image-variants --out image-variants.json
          jq -r '.notes[]' image-variants.json >> "$GITHUB_STEP_SUMMARY"
          current="$(jq -cS '.snapshot.files' registry/tables/image-variants.json)"
          draft="$(jq -cS '.table.snapshot.files' image-variants.json)"
          if [ "$current" != "$draft" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.diff.outputs.changed == 'true'
        with:
          name: image-variants-draft
          path: image-variants.json
          if-no-files-found: error
    outputs:
      changed: ${{ steps.diff.outputs.changed }}

  image-variants-propose:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && needs.image-variants-draft.outputs.changed == 'true'
    name: propose official image variants
    needs: image-variants-draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-variants-draft
      - name: Open or update the table review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="importers/image-variants"
          ref="refs/heads/$branch"
          path="importer-drafts/image-variants.json"
          mkdir -p importer-drafts
          mv image-variants.json "$path"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -- "$path"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: draft official image variants"
          gh auth setup-git
          remote_head="$(git ls-remote --refs origin "$ref")"
          expected="${remote_head%%$'\t'*}"
          git push --force-with-lease="$ref:$expected" origin "HEAD:$ref"
          title="chore: review official image variant drafts"
          open_pr="$(gh pr list --repo "$GH_REPO" --base "$DEFAULT_BRANCH" --head "$branch" --state open \
            --json number,isCrossRepository --jq 'map(select(.isCrossRepository == false)) | .[0].number // empty')"
          cat > body.md <<'BODY'
          Refreshes the draft from the changed Docker Official Images library files.
          Review the source commit and coverage notes in `importer-drafts/image-variants.json`.
          Copy its `table` object into `registry/tables/image-variants.json` once reviewed.
          BODY
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --title "$title" --body-file body.md
          else
            gh pr create --head "$branch" --base "$DEFAULT_BRANCH" --title "$title" --body-file body.md
          fi
